name: Heti Árfigyelő Frissítés

on:
  schedule:
    # Minden szombaton 8:00 UTC (10:00 magyar idő)
    - cron: '0 8 * * 6'
  workflow_dispatch: # Kézi indítás lehetősége gombnyomásra

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Árak begyűjtése és mentése
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scraper/extract_all_flyers.py
          python scraper/aldi_regular.py
          python scraper/backfill_groups.py
